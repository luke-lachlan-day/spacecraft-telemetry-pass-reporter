[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spacecraft-telemetry-pass-reporter"
version = "1.1.0"
description = "Generate polished HTML reports from fictional spacecraft-pass telemetry."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Luke Lachlan Day" }]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Typing :: Typed",
]
dependencies = [
  "Jinja2>=3.1.4,<4",
  "pydantic>=2.10,<3",
]

[project.optional-dependencies]
dev = [
  "mypy>=1.14,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.9,<1",
]
desktop = [
  "pywebview>=6.2.1,<7",
]
build = [
  "pyinstaller>=6.21,<7",
  "pywebview>=6.2.1,<7",
]
browser = [
  "playwright>=1.61,<2",
]

[project.scripts]
telemetry-report = "telemetry_report.cli:main"
telemetry-report-gui = "telemetry_report.desktop.launcher:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
telemetry_report = [
  "desktop/assets/*",
  "desktop/examples/*.json",
  "presentation/templates/*.jinja",
  "py.typed",
]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["B", "E", "F", "I", "PT", "RUF", "SIM", "UP"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
files = ["src"]

[tool.pytest.ini_options]
addopts = "--strict-config --strict-markers --basetemp=.pytest-tmp --cov=telemetry_report --cov-report=term-missing --cov-report=html --cov-fail-under=90"
testpaths = ["tests"]
markers = ["browser: tests requiring a locally installed Playwright Chromium browser"]

[tool.coverage.run]
branch = true
source = ["telemetry_report"]

[tool.coverage.report]
fail_under = 90
show_missing = true
skip_covered = true
exclude_also = [
  "if TYPE_CHECKING:",
  "if __name__ == .__main__.:",
]
