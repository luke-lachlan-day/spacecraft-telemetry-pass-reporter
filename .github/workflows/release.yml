name: Windows Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  quality-gate:
    uses: ./.github/workflows/quality.yml

  windows-x64:
    needs: quality-gate
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Set up Python 3.13.15 x64
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13.15"
          architecture: x64
          cache: pip
          cache-dependency-path: packaging/release/windows-py313-x64.lock

      - name: Install build dependencies
        run: |
          python -m pip install --require-hashes -r packaging/release/windows-py313-x64.lock
          python -m pip install --no-deps --no-build-isolation -e .
          python -m pip check

      - name: Resolve and validate release metadata
        shell: pwsh
        run: |
          $packageVersion = (& python -c "from importlib.metadata import version; print(version('spacecraft-telemetry-pass-reporter'))").Trim()
          if (-not $packageVersion) {
            throw "Could not resolve the installed package version"
          }

          $expectedTag = "v$packageVersion"
          $tagBuild = $env:GITHUB_EVENT_NAME -eq "release" -or $env:GITHUB_REF_TYPE -eq "tag"
          if ($tagBuild -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git ref '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'"
          }

          $archiveName = "spacecraft-telemetry-pass-reporter-$packageVersion-windows-x64.zip"
          $buildInfoName = "spacecraft-telemetry-pass-reporter-$packageVersion-windows-x64-build-info.txt"
          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "RELEASE_TAG=$expectedTag" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "BUILD_INFO_NAME=$buildInfoName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Reject existing published assets
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $existing = @(gh release view "$env:GITHUB_REF_NAME" --json assets --jq '.assets[].name')
          $planned = @($env:ARCHIVE_NAME, "$env:ARCHIVE_NAME.sha256", $env:BUILD_INFO_NAME)
          $collisions = @($planned | Where-Object { $_ -in $existing })
          if ($collisions.Count -gt 0) {
            throw "Release assets already exist and will not be replaced: $($collisions -join ', ')"
          }

      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller packaging/telemetry_reporter.spec --noconfirm --clean
          foreach ($required in @("LICENSE", "README.txt")) {
            if (-not (Test-Path -LiteralPath "dist\Telemetry Reporter\$required" -PathType Leaf)) {
              throw "PyInstaller bundle is missing required file: $required"
            }
          }

      - name: Record build information
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force | Out-Null
          $lockHash = (Get-FileHash -Path "packaging\release\windows-py313-x64.lock" -Algorithm SHA256).Hash.ToLowerInvariant()
          $pythonVersion = (& python --version).Trim()
          $pipVersion = (& python -m pip --version).Trim()
          $runnerPlatform = (& python -c "import platform; print(platform.platform())").Trim()
          $packages = @(& python -m pip list --format=freeze | Sort-Object)
          $content = @(
            "Spacecraft Telemetry Pass Reporter build information"
            "Package version: $env:PACKAGE_VERSION"
            "Tag: $env:RELEASE_TAG"
            "Commit SHA: $env:GITHUB_SHA"
            "Python: $pythonVersion"
            "pip: $pipVersion"
            "Runner platform: $runnerPlatform"
            "Runner image: $env:ImageOS $env:ImageVersion"
            "Lock SHA-256: $lockHash"
            ""
            "Resolved packages:"
          ) + $packages
          $assetPath = Join-Path "release-artifacts" $env:BUILD_INFO_NAME
          $content | Set-Content -LiteralPath $assetPath -Encoding utf8
          Copy-Item -LiteralPath $assetPath -Destination "dist\Telemetry Reporter\BUILD-INFO.txt"

      - name: Run packaged self-tests
        shell: pwsh
        run: |
          function Invoke-PackagedTest([string] $argument) {
            $process = Start-Process -FilePath "dist\Telemetry Reporter\Telemetry Reporter.exe" `
              -ArgumentList $argument -PassThru -WindowStyle Hidden
            if (-not $process.WaitForExit(60000)) {
              Stop-Process -Id $process.Id -Force
              throw "Packaged $argument timed out after 60 seconds"
            }
            if ($process.ExitCode -ne 0) {
              throw "Packaged $argument failed with exit code $($process.ExitCode)"
            }
          }
          Invoke-PackagedTest "--self-test"
          Invoke-PackagedTest "--ui-smoke-test"

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $archivePath = Join-Path "release-artifacts" $env:ARCHIVE_NAME
          Compress-Archive -Path "dist\Telemetry Reporter" -DestinationPath $archivePath
          $checksum = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $env:ARCHIVE_NAME" | Set-Content -Path "$archivePath.sha256" -Encoding ascii
          if ((Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant() -ne $checksum) {
            throw "ZIP checksum verification failed"
          }

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: spacecraft-telemetry-pass-reporter-windows-x64
          path: release-artifacts/*
          if-no-files-found: error

      - name: Attach files to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" `
            "release-artifacts\$env:ARCHIVE_NAME" `
            "release-artifacts\$env:ARCHIVE_NAME.sha256" `
            "release-artifacts\$env:BUILD_INFO_NAME"
