name: Windows Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Resolve and validate release metadata
        shell: pwsh
        run: |
          $packageVersion = (& python -c "from importlib.metadata import version; print(version('spacecraft-telemetry-pass-reporter'))").Trim()
          if (-not $packageVersion) {
            throw "Could not resolve the installed package version"
          }

          $expectedTag = "v$packageVersion"
          $tagBuild = $env:GITHUB_EVENT_NAME -eq "release" -or $env:GITHUB_REF_TYPE -eq "tag"
          if ($tagBuild -and $env:GITHUB_REF_NAME -ne $expectedTag) {
            throw "Git ref '$env:GITHUB_REF_NAME' does not match package version '$expectedTag'"
          }

          $archiveName = "spacecraft-telemetry-pass-reporter-$packageVersion-windows-x64.zip"
          "PACKAGE_VERSION=$packageVersion" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          "ARCHIVE_NAME=$archiveName" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller packaging/telemetry_reporter.spec --noconfirm --clean
          Copy-Item LICENSE "dist\Telemetry Reporter\LICENSE"
          Copy-Item packaging\release\README.txt "dist\Telemetry Reporter\README.txt"

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Telemetry Reporter\Telemetry Reporter.exe" `
            -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Path "release-artifacts" -Force | Out-Null
          $archivePath = Join-Path "release-artifacts" $env:ARCHIVE_NAME
          Compress-Archive -Path "dist\Telemetry Reporter" -DestinationPath $archivePath
          $checksum = (Get-FileHash -Path $archivePath -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $env:ARCHIVE_NAME" | Set-Content -Path "$archivePath.sha256" -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spacecraft-telemetry-pass-reporter-windows-x64
          path: release-artifacts/*
          if-no-files-found: error

      - name: Attach files to published release
        if: github.event_name == 'release'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release upload "$env:GITHUB_REF_NAME" `
            "release-artifacts\$env:ARCHIVE_NAME" `
            "release-artifacts\$env:ARCHIVE_NAME.sha256" `
            --clobber
