name: Windows Release

on:
  workflow_dispatch:
  release:
    types: [published]

permissions:
  contents: read

jobs:
  windows-x64:
    if: github.event_name == 'workflow_dispatch' || startsWith(github.ref_name, 'v')
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.13 x64
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          architecture: x64
          cache: pip

      - name: Install build dependencies
        run: python -m pip install -e ".[build]"

      - name: Build portable application
        shell: pwsh
        run: |
          pyinstaller packaging/telemetry_reporter.spec --noconfirm --clean
          Copy-Item LICENSE "dist\Telemetry Reporter\LICENSE"
          Copy-Item packaging\release\README.txt "dist\Telemetry Reporter\README.txt"

      - name: Run packaged self-test
        shell: pwsh
        run: |
          $process = Start-Process -FilePath "dist\Telemetry Reporter\Telemetry Reporter.exe" `
            -ArgumentList "--self-test" -Wait -PassThru -WindowStyle Hidden
          if ($process.ExitCode -ne 0) {
            throw "Packaged self-test failed with exit code $($process.ExitCode)"
          }

      - name: Create ZIP and checksum
        shell: pwsh
        run: |
          $archive = "spacecraft-telemetry-pass-reporter-1.1.0-windows-x64.zip"
          Compress-Archive -Path "dist\Telemetry Reporter" -DestinationPath $archive
          $checksum = (Get-FileHash -Path $archive -Algorithm SHA256).Hash.ToLowerInvariant()
          "$checksum  $archive" | Set-Content -Path "$archive.sha256" -Encoding ascii

      - name: Upload workflow artifacts
        uses: actions/upload-artifact@v4
        with:
          name: spacecraft-telemetry-pass-reporter-1.1.0-windows-x64
          path: |
            spacecraft-telemetry-pass-reporter-1.1.0-windows-x64.zip
            spacecraft-telemetry-pass-reporter-1.1.0-windows-x64.zip.sha256
          if-no-files-found: error

      - name: Attach files to published release
        if: github.event_name == 'release'
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ github.ref_name }}"
          spacecraft-telemetry-pass-reporter-1.1.0-windows-x64.zip
          spacecraft-telemetry-pass-reporter-1.1.0-windows-x64.zip.sha256
          --clobber
