name: Quality

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"

      - name: Check formatting
        run: ruff format --check .

      - name: Lint
        run: ruff check .

      - name: Type check
        run: mypy src

      - name: Test with coverage
        run: pytest

  package-smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Build wheel
        run: python -m pip wheel --no-deps --wheel-dir dist .

      - name: Create clean virtual environment
        run: python -m venv .package-smoke

      - name: Install and check wheel
        run: |
          .package-smoke/bin/python -m pip install dist/spacecraft_telemetry_pass_reporter-*.whl
          .package-smoke/bin/python -m pip check

      - name: Generate report from installed command
        run: >-
          .package-smoke/bin/telemetry-report sample-data/anomalous-pass.json
          --output .package-smoke/anomalous-pass-report.html

      - name: Compare packaged report with checked-in example
        run: >-
          cmp --silent .package-smoke/anomalous-pass-report.html
          examples/anomalous-pass-report.html
